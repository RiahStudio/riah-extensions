<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Riah Cookie Quiet</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="brand-links/support.css">
  </head>
  <body>
    <main class="popup">
      <p class="eyebrow">Riah Cookie Quiet</p>
      <h1 id="host">Current site</h1>
      <fieldset>
        <legend>Site mode</legend>
        <label><input type="radio" name="mode" value="reject"> Active (prefer reject)</label>
        <label><input type="radio" name="mode" value="disabled"> Disabled here</label>
        <label><input type="radio" name="mode" value="accept"> Auto-accept here</label>
      </fieldset>
      <a href="options.html" target="_blank" rel="noreferrer">Open settings</a>
      <p id="status" class="status"></p>
    </main>
    <script src="popup.js"></script>
      <script src="brand-links/support.js"></script>
  </body>
