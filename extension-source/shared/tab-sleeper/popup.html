<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Riah Tab Sleeper</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="brand-links/support.css">
  </head>
  <body>
    <main class="popup">
      <p class="eyebrow">Riah Tab Sleeper</p>
      <h1 id="host">Current tab</h1>
      <p id="idle" class="idle">Idle 0m 0s</p>
      <button id="discardNow" type="button">Discard this tab</button>
      <label class="toggle">
        <input id="excludeHost" type="checkbox">
        <span>Never discard this host</span>
      </label>
      <p id="status" class="status"></p>
    </main>
    <script src="popup.js"></script>
      <script src="brand-links/support.js"></script>
  </body>
</html>
